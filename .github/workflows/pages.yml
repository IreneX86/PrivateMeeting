name: Deploy frontend to GitHub Pages
# Manual only: changes are never published merely by pushing.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build:server
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate configuration and build frontend
        run: npm run validate:production && npm run build
        env:
          VITE_BASE_PATH: './'
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
          VITE_STUN_URLS: ${{ vars.VITE_STUN_URLS || vars.VITE_STUN_URL || 'stun:stun.l.google.com:19302' }}
          VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      - name: Check built Pages assets and shared links
        run: npx tsx tests/pages-smoke.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
